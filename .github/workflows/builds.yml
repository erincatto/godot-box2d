name: Build GDExtension
on:
  workflow_call:
  # Branch pushes are covered by their pull request, so only main builds on push
  push:
    branches: [main]
  pull_request:
  merge_group:

# A newer push to the same branch makes the running build pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
    strategy:
      fail-fast: false
      matrix:
        # 64 bit only. Box2D uses 64 bit intrinsics that 32 bit MSVC lacks.
        target:
          - { platform: linux, arch: x86_64, os: ubuntu-22.04, flags: -G Ninja -DCMAKE_BUILD_TYPE=Release }
          - { platform: windows, arch: x86_64, os: windows-latest, flags: -A x64, build-flags: --config Release }
          - { platform: macos, arch: universal, os: macos-latest, flags: -G Xcode, osx-archs: 'arm64;x86_64', build-flags: --config Release }
          - { platform: android, arch: arm64, abi: arm64-v8a, os: ubuntu-22.04 }
          - { platform: android, arch: x86_64, abi: x86_64, os: ubuntu-22.04 }
          - { platform: ios, arch: arm64, os: macos-latest, flags: -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_SYSTEM_PROCESSOR=arm64, osx-archs: arm64, build-flags: --config Release }
          # The manifest names the nothreads web build
          - { platform: web, arch: wasm32, os: ubuntu-22.04, flags: -DGODOTCPP_THREADS=OFF }
        target-type: [template_debug, template_release]

    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        if: matrix.target.platform != 'windows' && matrix.target.os != 'macos-latest'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup Android NDK
        id: ndk
        if: matrix.target.platform == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          link-to-sdk: true

      - name: Setup Emscripten
        if: matrix.target.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.11
          no-cache: true

      - name: Configure
        shell: bash
        env:
          PLATFORM: ${{ matrix.target.platform }}
          TARGET_TYPE: ${{ matrix.target-type }}
          FLAGS: ${{ matrix.target.flags }}
          OSX_ARCHS: ${{ matrix.target.osx-archs }}
          ANDROID_ABI: ${{ matrix.target.abi }}
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          # Word splitting is wanted for the plain flags. The architecture list holds a semicolon, so it
          # stays one quoted argument.
          args=(-S . -B build "-DGODOTCPP_TARGET=$TARGET_TYPE" $FLAGS)
          if [ -n "$OSX_ARCHS" ]; then
            args+=("-DCMAKE_OSX_ARCHITECTURES=$OSX_ARCHS")
          fi
          if [ "$PLATFORM" = android ]; then
            args+=(-G Ninja -DCMAKE_BUILD_TYPE=Release --toolchain "$NDK_PATH/build/cmake/android.toolchain.cmake" -DANDROID_PLATFORM=24 "-DANDROID_ABI=$ANDROID_ABI")
          elif [ "$PLATFORM" = web ]; then
            args+=(-G Ninja -DCMAKE_BUILD_TYPE=Release --toolchain "$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake")
          fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build ${{ matrix.target.build-flags }}

      - name: Windows - Delete linker files
        if: matrix.target.platform == 'windows'
        shell: pwsh
        run: Remove-Item demo/bin/windows/* -Include *.exp,*.lib,*.pdb,*.ilk -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-box2d-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
          path: |
            demo/bin/${{ matrix.target.platform }}/*
            !demo/bin/${{ matrix.target.platform }}/.gitkeep

  # Merges every build into a single godot-box2d artifact
  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: godot-box2d
          pattern: godot-box2d-*
          delete-merged: true
